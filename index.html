<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>犯人は踊る - オンライン対戦</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&display=swap');
    
    body {
      font-family: 'M PLUS Rounded 1c', sans-serif;
      background-color: #0f382c;
      background-image: radial-gradient(#155241 2px, transparent 2px);
      background-size: 24px 24px;
      color: #ffffff;
      touch-action: manipulation;
    }

    .pop-shadow {
      box-shadow: 0 8px 0 #0f172a, 0 15px 25px rgba(0, 0, 0, 0.4);
    }
    
    .pop-button {
      box-shadow: 0 6px 0 #b91c1c;
      transition: all 0.1s ease;
    }
    .pop-button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #b91c1c;
    }

    .card-pop {
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .card-pop:hover {
      transform: translateY(-12px) rotate(-1deg) scale(1.03);
    }

    .felt-table {
      background: radial-gradient(circle, #1a634e 0%, #0d3026 100%);
      border: 12px solid #854d0e;
      box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.6), 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #f59e0b;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen select-none">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CARD_TYPES = {
      FIRST_DISCOVERER: { id: 'first_discoverer', name: '第一発見者', bg: 'bg-amber-400', border: 'border-amber-600', text: 'text-amber-950', icon: 'fa-magnifying-glass', desc: '手札にある人が最初に場に出します。' },
      CRIMINAL: { id: 'criminal', name: '犯人', bg: 'bg-rose-500', border: 'border-rose-700', text: 'text-white', icon: 'fa-user-ninja', desc: '最後まで手札に持ち、手札1枚として出すと勝利！' },
      DETECTIVE: { id: 'detective', name: '探偵', bg: 'bg-sky-400', border: 'border-sky-600', text: 'text-sky-950', icon: 'fa-user-tie', desc: '1人を指名。「犯人ですか？」と当てれば勝利！' },
      ALIBI: { id: 'alibi', name: 'アリバイ', bg: 'bg-emerald-400', border: 'border-emerald-600', text: 'text-emerald-950', icon: 'fa-shield-halved', desc: '犯人カードを持っていても「犯人ではありません」と逃げられる。' },
      SCHEME: { id: 'scheme', name: 'たくらみ', bg: 'bg-purple-500', border: 'border-purple-700', text: 'text-white', icon: 'fa-masks-theater', desc: '犯人が勝利したとき、自分も一緒に勝利！' },
      DOG: { id: 'dog', name: 'いぬ', bg: 'bg-orange-400', border: 'border-orange-600', text: 'text-orange-950', icon: 'fa-dog', desc: '相手の手札から1枚引く。それが「犯人」なら勝利！' },
      BOY: { id: 'boy', name: '少年', bg: 'bg-cyan-300', border: 'border-cyan-500', text: 'text-cyan-950', icon: 'fa-child-reaching', desc: '犯人が誰かを目撃できる。' },
      CITIZEN: { id: 'citizen', name: '一般人', bg: 'bg-slate-300', border: 'border-slate-500', text: 'text-slate-800', icon: 'fa-user-group', desc: '効果なし。安全に手札を消費。' },
      RUMOR: { id: 'rumor', name: 'うわさ', bg: 'bg-pink-400', border: 'border-pink-600', text: 'text-pink-950', icon: 'fa-comments', desc: '全員が右隣の人の手札からランダムに1枚引く。' },
      INFORMATION: { id: 'information', name: '情報操作', bg: 'bg-teal-300', border: 'border-teal-500', text: 'text-teal-950', icon: 'fa-arrow-rotate-right', desc: '全員が左隣の人に好きな手札を1枚渡す。' },
      TRADE: { id: 'trade', name: '取り引き', bg: 'bg-yellow-400', border: 'border-yellow-600', text: 'text-yellow-950', icon: 'fa-handshake', desc: '指定した人とカードを1枚交換する。' }
    };

    function App() {
      const [screen, setScreen] = useState('title');
      const [roomCode, setRoomCode] = useState('');
      const [inputCode, setInputCode] = useState('');
      const [playerName, setPlayerName] = useState('');
      const [isHost, setIsHost] = useState(false);
      
      const [players, setPlayers] = useState([]);
      const [myId, setMyId] = useState(null);
      const [turnIndex, setTurnIndex] = useState(0);
      const [logs, setLogs] = useState([]);
      const [winner, setWinner] = useState(null);
      const [showRules, setShowRules] = useState(false);
      const logEndRef = useRef(null);

      const peerRef = useRef(null);
      const connectionsRef = useRef([]);

      useEffect(() => {
        if (logEndRef.current) {
          logEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs]);

      const generate3DigitCode = () => Math.floor(100 + Math.random() * 900).toString();

      const handleCreateRoom = () => {
        if (!playerName.trim()) return alert('名前を入力してください！');
        const code = generate3DigitCode();
        setRoomCode(code);
        setIsHost(true);

        const peerId = `hannin-room-${code}-host`;
        const peer = new Peer(peerId);
        peerRef.current = peer;

        peer.on('open', (id) => {
          setMyId(id);
          const initialPlayers = [{ id, name: playerName, hand: [], played: [] }];
          setPlayers(initialPlayers);
          setScreen('lobby');
        });

        peer.on('connection', (conn) => {
          connectionsRef.current.push(conn);
          conn.on('data', (data) => handleHostReceiveData(data, conn));
        });

        peer.on('error', (err) => {
          alert('部屋の作成に失敗しました。もう一度お試しください。');
        });
      };

      const handleJoinRoom = () => {
        if (!playerName.trim()) return alert('名前を入力してください！');
        if (inputCode.length !== 3) return alert('3桁の部屋番号を入力してください！');

        const code = inputCode;
        setRoomCode(code);
        setIsHost(false);

        const peer = new Peer();
        peerRef.current = peer;

        peer.on('open', (id) => {
          setMyId(id);
          const hostPeerId = `hannin-room-${code}-host`;
          const conn = peer.connect(hostPeerId);
          connectionsRef.current = [conn];

          conn.on('open', () => {
            conn.send({ type: 'JOIN', name: playerName, id });
            setScreen('lobby');
          });

          conn.on('data', (data) => handleClientReceiveData(data));
        });

        peer.on('error', (err) => {
          alert('部屋が見つかりませんでした。番号を確認してください。');
        });
      };

      const broadcast = (data) => {
        connectionsRef.current.forEach(conn => {
          if (conn.open) conn.send(data);
        });
      };

      const handleHostReceiveData = (data, conn) => {
        if (data.type === 'JOIN') {
          setPlayers(prev => {
            if (prev.some(p => p.id === data.id)) return prev;
            const updated = [...prev, { id: data.id, name: data.name, hand: [], played: [] }];
            broadcast({ type: 'SYNC_LOBBY', players: updated });
            return updated;
          });
        } else if (data.type === 'PLAY_CARD') {
          handlePlayCard(data.playerIdx, data.cardIdx, data.extraData);
        }
      };

      const handleClientReceiveData = (data) => {
        if (data.type === 'SYNC_LOBBY') {
          setPlayers(data.players);
        } else if (data.type === 'START_GAME') {
          setPlayers(data.players);
          setTurnIndex(data.turnIndex);
          setLogs(data.logs);
          setScreen('game');
        } else if (data.type === 'UPDATE_STATE') {
          setPlayers(data.players);
          setTurnIndex(data.turnIndex);
          setLogs(data.logs);
          if (data.winner) {
            setWinner(data.winner);
            setScreen('result');
          }
        }
      };

      const handleStartGame = () => {
        if (players.length < 3) {
          alert('ゲームを開始するには最低3人のプレイヤーが必要です！');
          return;
        }

        const count = players.length;
        let deck = [];
        deck.push({ ...CARD_TYPES.FIRST_DISCOVERER, instanceId: Math.random() });
        deck.push({ ...CARD_TYPES.CRIMINAL, instanceId: Math.random() });
        deck.push({ ...CARD_TYPES.DETECTIVE, instanceId: Math.random() });
        deck.push({ ...CARD_TYPES.ALIBI, instanceId: Math.random() });
        deck.push({ ...CARD_TYPES.SCHEME, instanceId: Math.random() });

        const fillerTypes = [
          CARD_TYPES.CITIZEN, CARD_TYPES.RUMOR, CARD_TYPES.INFORMATION,
          CARD_TYPES.TRADE, CARD_TYPES.DOG, CARD_TYPES.BOY,
          CARD_TYPES.DETECTIVE, CARD_TYPES.ALIBI
        ];

        while (deck.length < count * 4) {
          const randType = fillerTypes[Math.floor(Math.random() * fillerTypes.length)];
          deck.push({ ...randType, instanceId: Math.random() });
        }

        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }

        let starterIdx = 0;
        const updatedPlayers = players.map((p, pIdx) => {
          const hand = deck.slice(pIdx * 4, (pIdx + 1) * 4);
          if (hand.some(c => c.id === 'first_discoverer')) starterIdx = pIdx;
          return { ...p, hand, played: [] };
        });

        const initialLogs = [`🎮 ゲーム開始！【第一発見者】を持つ ${updatedPlayers[starterIdx].name} からスタートです！`];

        setPlayers(updatedPlayers);
        setTurnIndex(starterIdx);
        setLogs(initialLogs);
        setScreen('game');

        broadcast({
          type: 'START_GAME',
          players: updatedPlayers,
          turnIndex: starterIdx,
          logs: initialLogs
        });
      };

      const handlePlayCard = (playerIdx, cardIdx, extraData = {}) => {
        if (!isHost) {
          connectionsRef.current[0].send({ type: 'PLAY_CARD', playerIdx, cardIdx, extraData });
          return;
        }

        const currentPlayer = players[playerIdx];
        const card = currentPlayer.hand[cardIdx];

        let newLogs = [...logs, `📢 ${currentPlayer.name} が【${card.name}】を出しました！`];

        const newHand = [...currentPlayer.hand];
        newHand.splice(cardIdx, 1);

        let nextPlayers = [...players];
        nextPlayers[playerIdx] = {
          ...currentPlayer,
          hand: newHand,
          played: [...currentPlayer.played, card]
        };

        let gameWinner = null;
        const actor = nextPlayers[playerIdx];

        switch (card.id) {
          case 'first_discoverer':
            newLogs.push(`🔍 事件発生！${actor.name} が事件を発見！`);
            break;

          case 'criminal':
            gameWinner = calculateWinner('criminal', playerIdx, nextPlayers);
            newLogs.push(`😈 犯人が逃げ切った！【犯人】を出した ${actor.name} の勝利！`);
            break;

          case 'detective':
            if (extraData.targetId !== undefined) {
              const target = nextPlayers.find(p => p.id === extraData.targetId);
              newLogs.push(`🕵️ ${actor.name} が ${target.name} に「あなたが犯人ですか？」と追及！`);

              const hasCriminal = target.hand.some(c => c.id === 'criminal');
              const hasAlibi = target.hand.some(c => c.id === 'alibi');

              if (hasCriminal && !hasAlibi) {
                newLogs.push(`🎯 ${target.name} 「参りました…私が犯人です！」`);
                gameWinner = calculateWinner('detective', playerIdx, nextPlayers);
              } else if (hasCriminal && hasAlibi) {
                newLogs.push(`🛡️ ${target.name} 「アリバイがあります！犯人ではありません。」（回避成功！）`);
              } else {
                newLogs.push(`❌ ${target.name} 「違います！犯人ではありません。」`);
              }
            }
            break;

          case 'dog':
            if (extraData.targetId !== undefined) {
              const target = nextPlayers.find(p => p.id === extraData.targetId);
              if (target.hand.length > 0) {
                const stolenIdx = Math.floor(Math.random() * target.hand.length);
                const stolen = target.hand[stolenIdx];

                target.hand.splice(stolenIdx, 1);
                actor.hand.push(stolen);

                newLogs.push(`🐕 ${actor.name} の「いぬ」が ${target.name} から【${stolen.name}】を引き抜いた！`);

                if (stolen.id === 'criminal') {
                  newLogs.push(`🎉 「いぬ」が犯人を見事にクンクン当てた！`);
                  gameWinner = calculateWinner('dog', playerIdx, nextPlayers);
                }
              }
            }
            break;

          case 'boy':
            const crim = nextPlayers.find(p => p.hand.some(c => c.id === 'criminal'));
            newLogs.push(crim ? `👁️ 「少年」が目撃した！犯人は… ${crim.name} だ！（目撃者のみ）` : `👁️ 「少年」は何も目撃できなかった…`);
            break;

          default:
            break;
        }

        let nextTurn = (turnIndex + 1) % players.length;
        let loopCount = 0;
        while (nextPlayers[nextTurn].hand.length === 0 && loopCount < players.length) {
          nextTurn = (nextTurn + 1) % players.length;
          loopCount++;
        }

        setPlayers(nextPlayers);
        setTurnIndex(nextTurn);
        setLogs(newLogs);

        if (gameWinner) {
          setWinner(gameWinner);
          setScreen('result');
        }

        broadcast({
          type: 'UPDATE_STATE',
          players: nextPlayers,
          turnIndex: nextTurn,
          logs: newLogs,
          winner: gameWinner
        });
      };

      const calculateWinner = (type, winnerIdx, currentPlayers) => {
        let winners = [currentPlayers[winnerIdx].name];
        if (type === 'criminal') {
          currentPlayers.forEach(p => {
            if (p.hand.some(c => c.id === 'scheme') || p.played.some(c => c.id === 'scheme')) {
              if (!winners.includes(p.name)) winners.push(p.name);
            }
          });
        }
        return { type, names: winners.join(', ') };
      };

      return (
        <div className="min-h-screen flex flex-col justify-between max-w-5xl mx-auto px-4 py-4 select-none">
          <header className="flex justify-between items-center bg-amber-400 border-4 border-slate-900 rounded-2xl p-3 pop-shadow mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-rose-500 rounded-full border-2 border-slate-900 flex items-center justify-center text-xl shadow">
                🕵️
              </div>
              <div>
                <h1 className="text-xl font-black text-slate-900 tracking-wider">犯人は踊る</h1>
                <p className="text-[10px] text-amber-950 font-extrabold">ONLINE POP EDITION</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              {roomCode && (
                <div className="bg-slate-900 text-amber-400 font-black px-3 py-1 rounded-xl text-xs border-2 border-amber-500">
                  部屋番号: <span className="text-sm font-mono tracking-widest">{roomCode}</span>
                </div>
              )}
              <button 
                onClick={() => setShowRules(true)}
                className="bg-sky-400 hover:bg-sky-300 text-slate-900 border-2 border-slate-900 px-3 py-1.5 rounded-xl font-extrabold text-xs shadow transition active:translate-y-0.5"
              >
                <i className="fa-solid fa-book-open"></i> ルール
              </button>
            </div>
          </header>

          {screen === 'title' && (
            <div className="my-auto py-8 flex flex-col items-center">
              <div className="bg-amber-400 border-4 border-slate-900 rounded-3xl p-8 max-w-md w-full pop-shadow text-slate-900 text-center">
                <div className="inline-block bg-rose-500 text-white text-xs font-black px-4 py-1.5 rounded-full border-2 border-slate-900 mb-4 shadow">
                  3桁のコードで即プレイ！
                </div>
                <h2 className="text-3xl font-black mb-6 tracking-wide">部屋を選んで遊ぼう！</h2>

                <div className="space-y-4 mb-6">
                  <div className="text-left">
                    <label className="block text-xs font-black mb-1">あなたの名前:</label>
                    <input
                      type="text"
                      placeholder="例: たろう"
                      value={playerName}
                      onChange={(e) => setPlayerName(e.target.value)}
                      className="w-full px-4 py-3 bg-white border-3 border-slate-900 rounded-2xl font-bold text-slate-900 focus:outline-none focus:ring-4 focus:ring-rose-400"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 gap-3">
                  <button
                    onClick={handleCreateRoom}
                    className="w-full bg-rose-500 hover:bg-rose-400 text-white font-black py-4 rounded-2xl border-3 border-slate-900 pop-button text-base flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-plus text-xl"></i> 部屋を作る (ホスト)
                  </button>

                  <div className="relative my-2 flex items-center justify-center">
                    <hr className="w-full border-slate-900 border-dashed" />
                    <span className="absolute bg-amber-400 px-3 text-xs font-black">または</span>
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="number"
                      placeholder="3桁番号"
                      maxLength={3}
                      value={inputCode}
                      onChange={(e) => setInputCode(e.target.value)}
                      className="w-1/2 px-3 py-3 bg-white border-3 border-slate-900 rounded-2xl font-mono text-center font-black text-xl text-slate-900 focus:outline-none"
                    />
                    <button
                      onClick={handleJoinRoom}
                      className="w-1/2 bg-sky-400 hover:bg-sky-300 text-slate-900 font-black py-3 rounded-2xl border-3 border-slate-900 pop-button text-sm flex items-center justify-center gap-1"
                    >
                      <i className="fa-solid fa-right-to-bracket"></i> 参加する
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {screen === 'lobby' && (
            <div className="my-auto py-8 flex flex-col items-center">
              <div className="bg-amber-400 border-4 border-slate-900 rounded-3xl p-6 max-w-md w-full pop-shadow text-slate-900">
                <div className="text-center mb-6">
                  <span className="text-xs font-black bg-slate-900 text-amber-400 px-3 py-1 rounded-full border border-amber-400">
                    ROOM CODE
                  </span>
                  <div className="text-5xl font-black font-mono tracking-widest text-slate-900 my-2">
                    {roomCode}
                  </div>
                  <p className="text-xs font-bold text-amber-950">友達にこの3桁の部屋番号を伝えてね！</p>
                </div>

                <div className="bg-amber-100 border-3 border-slate-900 rounded-2xl p-4 mb-6">
                  <h3 className="font-black text-xs text-slate-700 mb-3 flex items-center gap-2">
                    <i className="fa-solid fa-users text-rose-500"></i> 参加中のメンバー ({players.length}/5人)
                  </h3>
                  <div className="space-y-2">
                    {players.map((p, i) => (
                      <div key={p.id} className="bg-white border-2 border-slate-900 px-3 py-2 rounded-xl flex justify-between items-center font-extrabold text-sm shadow-sm">
                        <span className="flex items-center gap-2">
                          <span className="w-6 h-6 rounded-full bg-rose-400 text-white text-xs flex items-center justify-center border border-slate-900">
                            {i + 1}
                          </span>
                          {p.name}
                        </span>
                        {i === 0 && (
                          <span className="text-[10px] bg-amber-400 text-slate-900 border border-slate-900 px-2 py-0.5 rounded-md">
                            ホスト
                          </span>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                {isHost ? (
                  <button
                    onClick={handleStartGame}
                    className="w-full bg-rose-500 hover:bg-rose-400 text-white font-black py-4 rounded-2xl border-3 border-slate-900 pop-button text-lg flex items-center justify-center gap-2"
                  >
                    <i className="fa-solid fa-play"></i> ゲームを開始する！
                  </button>
                ) : (
                  <div className="text-center py-3 bg-amber-300 border-2 border-slate-900 rounded-xl font-black text-sm text-amber-950 animate-pulse">
                    ホストがゲームを開始するのを待っています...
                  </div>
                )}
              </div>
            </div>
          )}

          {screen === 'game' && (
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 my-auto">
              <div className="md:col-span-2 felt-table rounded-3xl p-4 flex flex-col justify-between min-h-[480px] relative">
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                  {players.filter(p => p.id !== myId).map(p => {
                    const isCurrentTurn = players[turnIndex]?.id === p.id;
                    return (
                      <div
                        key={p.id}
                        className={`p-2.5 rounded-2xl border-3 transition ${
                          isCurrentTurn
                            ? 'bg-amber-400 border-slate-900 text-slate-900 font-black shadow-lg scale-105 ring-4 ring-rose-400'
                            : 'bg-slate-900/80 border-emerald-600 text-white'
                        }`}
                      >
                        <div className="text-xs font-black truncate">{p.name}</div>
                        <div className="text-[10px] opacity-80 mt-1 flex items-center justify-between">
                          <span>手札:</span>
                          <span className="font-mono bg-black/40 px-1.5 py-0.5 rounded text-amber-300 font-bold">
                            {p.hand.length}枚
                          </span>
                        </div>
                      </div>
                    );
                  })}
                </div>

                <div className="text-center my-4">
                  <div className="inline-block bg-amber-400 border-3 border-slate-900 px-6 py-2 rounded-full pop-shadow">
                    <span className="text-xs font-black text-slate-900">現在のターン:</span>
                    <span className="text-lg font-black text-rose-600 ml-2">
                      {players[turnIndex]?.name} {players[turnIndex]?.id === myId && '(あなた)'}
                    </span>
                  </div>
                </div>

                <div className="bg-slate-900/90 border-3 border-amber-500 rounded-2xl p-3">
                  <div className="flex justify-between items-center mb-2">
                    <span className="text-xs font-black text-amber-400 flex items-center gap-1">
                      <i className="fa-solid fa-hand"></i> あなたの手札 ({players.find(p => p.id === myId)?.hand.length || 0}枚)
                    </span>
                  </div>

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
                    {players.find(p => p.id === myId)?.hand.map((card, cIdx) => {
                      const isMyTurn = players[turnIndex]?.id === myId;
                      return (
                        <div
                          key={card.instanceId}
                          className={`card-pop rounded-xl p-2.5 ${card.bg} border-3 ${card.border} ${card.text} flex flex-col justify-between h-36 relative overflow-hidden`}
                        >
                          <div>
                            <div className="flex justify-between items-center mb-1">
                              <span className="font-black text-xs">{card.name}</span>
                              <i className={`fa-solid ${card.icon} text-xs opacity-70`}></i>
                            </div>
                            <p className="text-[9px] font-bold leading-tight opacity-90 line-clamp-4">{card.desc}</p>
                          </div>

                          {isMyTurn ? (
                            <button
                              onClick={() => {
                                const myIdx = players.findIndex(p => p.id === myId);
                                handlePlayCard(myIdx, cIdx);
                              }}
                              className="w-full bg-slate-900 hover:bg-rose-500 text-white font-black text-xs py-1 rounded-lg border border-white/20 transition shadow"
                            >
                              出す！
                            </button>
                          ) : (
                            <div className="text-[9px] font-black text-center opacity-50 py-0.5">待機中</div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>

              <div className="bg-amber-400 border-4 border-slate-900 rounded-3xl p-4 flex flex-col h-[480px] pop-shadow">
                <h3 className="font-black text-xs text-slate-900 mb-3 flex items-center gap-1.5 border-b-2 border-slate-900 pb-2">
                  <i className="fa-solid fa-list-ul text-rose-500"></i> ゲーム実況ログ
                </h3>
                <div className="flex-1 overflow-y-auto space-y-2 pr-1 custom-scrollbar text-xs font-bold">
                  {logs.map(log => (
                    <div key={log.id} className="bg-white border-2 border-slate-900 p-2 rounded-xl text-slate-900 shadow-sm leading-relaxed">
                      {log.text}
                    </div>
                  ))}
                  <div ref={logEndRef} />
                </div>
              </div>
            </div>
          )}

          {screen === 'result' && winner && (
            <div className="my-auto py-8 flex flex-col items-center">
              <div className="bg-amber-400 border-4 border-slate-900 rounded-3xl p-8 max-w-md w-full pop-shadow text-center text-slate-900">
                <div className="text-6xl mb-2">🏆</div>
                <h2 className="text-3xl font-black mb-2 text-rose-600">ゲーム決着！</h2>
                <div className="bg-white border-3 border-slate-900 p-4 rounded-2xl mb-6">
                  <span className="text-xs font-black text-slate-500 block mb-1">勝者</span>
                  <span className="text-xl font-black text-slate-900">{winner.names}</span>
                </div>

                <button
                  onClick={() => {
                    if (isHost) handleStartGame();
                  }}
                  disabled={!isHost}
                  className={`w-full font-black py-4 rounded-2xl border-3 border-slate-900 pop-button text-base ${
                    isHost ? 'bg-rose-500 hover:bg-rose-400 text-white' : 'bg-slate-300 text-slate-500 cursor-not-allowed'
                  }`}
                >
                  {isHost ? 'もう一度遊ぶ！' : 'ホストが再開するのを待っています'}
                </button>
              </div>
            </div>
          )}

          {showRules && (
            <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-amber-400 border-4 border-slate-900 rounded-3xl p-6 max-w-lg w-full max-h-[80vh] flex flex-col pop-shadow text-slate-900">
                <div className="flex justify-between items-center mb-3 border-b-2 border-slate-900 pb-2">
                  <h3 className="font-black text-lg text-slate-900">カード一覧・ルール</h3>
                  <button onClick={() => setShowRules(false)} className="text-xl font-black">✕</button>
                </div>
                <div className="overflow-y-auto space-y-2 pr-1 custom-scrollbar text-xs font-bold">
                  {Object.values(CARD_TYPES).map(c => (
                    <div key={c.id} className={`p-2.5 rounded-xl border-2 ${c.border} ${c.bg} ${c.text}`}>
                      <span className="font-black text-sm">{c.name}</span>
                      <p className="text-[10px] mt-0.5 opacity-90">{c.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
